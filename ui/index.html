<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Transcry</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --fond:#0F172A; --carte:rgba(30,41,59,.58); --bord:rgba(148,163,184,.18);
  --texte:#F1F5F9; --discret:#94A3B8; --indigo:#6366F1; --violet:#8B5CF6;
  --clair:#A5B4FC; --succes:#34D399; --erreur:#F87171; --piste:#334155;
  --degrade:linear-gradient(100deg,#6366F1,#8B5CF6);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  color:var(--texte); overflow:hidden; user-select:none;
  background:
    radial-gradient(circle at 12% 8%, rgba(99,102,241,.38) 0, transparent 46%),
    radial-gradient(circle at 92% 28%, rgba(139,92,246,.30) 0, transparent 42%),
    radial-gradient(circle at 30% 105%, rgba(56,189,248,.18) 0, transparent 50%),
    var(--fond);
  display:flex; align-items:center; justify-content:center; padding:32px;
}
.carte{
  width:100%; height:100%; background:var(--carte); border:1px solid var(--bord);
  border-radius:32px; box-shadow:0 30px 80px rgba(2,6,23,.55);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  display:flex; align-items:center; justify-content:center; padding:36px; position:relative;
}
.ecran{display:none; flex-direction:column; align-items:center; width:100%}
.ecran.actif{display:flex; animation:entree .45s cubic-bezier(.2,.8,.2,1)}
@keyframes entree{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}

/* onde animée */
.onde{display:flex; align-items:center; gap:5px; height:64px}
.onde i{display:block; width:6px; border-radius:3px; background:linear-gradient(180deg,#A5B4FC,#8B5CF6);
  animation:eq 1.1s ease-in-out infinite; transform-origin:center}
.onde i:nth-child(2){animation-delay:.12s}.onde i:nth-child(3){animation-delay:.24s}
.onde i:nth-child(4){animation-delay:.36s}.onde i:nth-child(5){animation-delay:.48s}
.onde i:nth-child(6){animation-delay:.6s}.onde i:nth-child(7){animation-delay:.72s}
.onde i:nth-child(8){animation-delay:.84s}.onde i:nth-child(9){animation-delay:.96s}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.onde.grande{height:90px; gap:6px}

h1{margin:26px 0 0; font-size:38px; font-weight:800; letter-spacing:-1px; text-align:center; line-height:1.12}
h2{margin:24px 0 0; font-size:30px; font-weight:800; letter-spacing:-.5px; text-align:center}
.sous{margin:14px 0 0; font-size:15px; line-height:1.6; color:var(--discret); text-align:center; max-width:410px}
.puces{display:flex; gap:10px; margin-top:28px; flex-wrap:wrap; justify-content:center}
.puce{background:rgba(51,65,85,.55); border:1px solid var(--bord); border-radius:999px; padding:9px 16px;
  font-size:13px; font-weight:600; transition:transform .25s ease, border-color .25s ease}
.puce:hover{transform:translateY(-3px); border-color:var(--indigo)}
.puce b{color:var(--clair); margin-right:6px}

button{font-family:inherit; cursor:pointer; border:0; color:inherit}
button:focus-visible{outline:2px solid var(--clair); outline-offset:3px}
.cta{
  position:relative; overflow:hidden; margin-top:36px; width:340px; height:66px; border-radius:33px;
  background:var(--degrade); color:#fff; font-size:17px; font-weight:800;
  box-shadow:0 14px 34px rgba(99,102,241,.40);
  transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
}
.cta:hover{transform:translateY(-4px) scale(1.03); box-shadow:0 22px 50px rgba(139,92,246,.55)}
.cta:active{transform:none}
.cta::after{content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-20deg); transition:left .7s ease}
.cta:hover::after{left:130%}
.cta:disabled{opacity:.6; cursor:wait; transform:none}
.formats{margin-top:16px; font-size:12.5px; color:var(--discret)}
.etat{margin-top:10px; display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--discret)}
.etat span{width:8px; height:8px; border-radius:50%; background:var(--discret)}
.etat.pret span{background:var(--succes)}
.etat.charge span{animation:clig 1.2s ease-in-out infinite}
@keyframes clig{50%{opacity:.25}}

.fichier{margin-top:28px; font-size:20px; font-weight:800; text-align:center; word-break:break-all; max-width:420px}
.statut{margin-top:8px; font-size:14px; color:var(--discret)}
.piste{margin-top:28px; width:360px; height:10px; border-radius:5px; background:var(--piste); overflow:hidden}
.piste div{height:100%; width:0; border-radius:5px; background:var(--degrade); transition:width .3s ease}
.pct{margin-top:14px; font-size:26px; font-weight:800; color:var(--clair)}

.rond{width:84px; height:84px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--degrade); box-shadow:0 14px 34px rgba(99,102,241,.4)}
.rond.err{background:rgba(248,113,113,.16); box-shadow:none}
.chemin{margin:10px 0 0; font-size:13px; color:var(--discret); text-align:center; word-break:break-all; max-width:430px; user-select:text}
.btn{margin-top:12px; width:280px; height:54px; border-radius:27px; font-size:15px; font-weight:600;
  background:transparent; border:1px solid var(--bord);
  transition:background .2s ease, transform .2s ease, border-color .2s ease}
.btn:hover{background:rgba(99,102,241,.16); border-color:var(--indigo); transform:translateY(-2px)}
.btn.plein{background:var(--degrade); border:0; font-weight:800; color:#fff; margin-top:30px}
.btn.plein:hover{box-shadow:0 14px 34px rgba(139,92,246,.5)}
.btn.lien{border-color:transparent; color:var(--clair)}
</style>
</head>
<body>
<main class="carte">

  <!-- Accueil -->
  <section class="ecran actif" id="accueil">
    <div class="onde" aria-hidden="true">
      <i style="height:34px"></i><i style="height:29px"></i><i style="height:10px"></i><i style="height:20px"></i><i style="height:23px"></i><i style="height:48px"></i><i style="height:37px"></i><i style="height:62px"></i><i style="height:31px"></i>
    </div>
    <h1>Parlez,<br>ça s'écrit.</h1>
    <p class="sous">Déposez un enregistrement, l'application le transforme en texte. Tout est traité sur votre ordinateur.</p>
    <div class="puces">
      <div class="puce"><b>1</b>Choisir le fichier</div>
      <div class="puce"><b>2</b>Patienter</div>
      <div class="puce"><b>3</b>Récupérer le .txt</div>
    </div>
    <button class="cta" id="btn-start" type="button">Transcrire mon audio</button>
    <div class="formats">mp3 · wav · m4a · mp4 · mkv · flac</div>
    <div class="etat charge" id="etat"><span></span><em style="font-style:normal" id="etat-txt">Préparation du modèle...</em></div>
  </section>

  <!-- Chargement -->
  <section class="ecran" id="travail">
    <div class="onde grande" aria-hidden="true">
      <i style="height:80px"></i><i style="height:80px"></i><i style="height:80px"></i><i style="height:80px"></i><i style="height:80px"></i><i style="height:80px"></i><i style="height:80px"></i><i style="height:80px"></i><i style="height:80px"></i>
    </div>
    <div class="fichier" id="nom-fichier"></div>
    <div class="statut" id="statut" role="status">Démarrage...</div>
    <div class="piste"><div id="barre"></div></div>
    <div class="pct"><span id="pct">0</span> %</div>
  </section>

  <!-- Résultat -->
  <section class="ecran" id="resultat">
    <div class="rond" id="icone-ok">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h2>C'est écrit !</h2>
    <p class="chemin" id="chemin"></p>
    <button class="btn plein" id="btn-texte" type="button">Ouvrir le texte</button>
    <button class="btn" id="btn-dossier" type="button">Ouvrir le dossier</button>
    <button class="btn lien" data-retour type="button">Transcrire un autre audio</button>
  </section>

  <!-- Erreur -->
  <section class="ecran" id="erreur">
    <div class="rond err">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#F87171" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 6v8M12 18v.5"/></svg>
    </div>
    <h2>Une erreur est survenue</h2>
    <p class="chemin" id="msg-erreur"></p>
    <button class="btn plein" data-retour type="button">Revenir à l'accueil</button>
  </section>

</main>

<script>
const $ = (id) => document.getElementById(id);
const ecrans = ["accueil", "travail", "resultat", "erreur"];
const api = () => window.pywebview.api;

function montrer(nom) {
  ecrans.forEach((e) => $(e).classList.toggle("actif", e === nom));
}

// Appelé par Python
window.app = {
  modelePret() {
    $("etat").className = "etat pret";
    $("etat-txt").textContent = "Modèle prêt";
  },
  statut(texte) { $("statut").textContent = texte; },
  progression(p) {
    $("barre").style.width = p + "%";
    $("pct").textContent = Math.round(p);
    $("statut").textContent = "Transcription en cours...";
  },
  fini(chemin) {
    $("chemin").textContent = chemin;
    montrer("resultat");
    $("btn-start").disabled = false;
  },
  erreur(message) {
    $("msg-erreur").textContent = message;
    montrer("erreur");
    $("btn-start").disabled = false;
  },
};

$("btn-start").addEventListener("click", async () => {
  const nom = await api().choisir();
  if (!nom) return;           // dialogue annulé
  $("btn-start").disabled = true;
  $("nom-fichier").textContent = nom;
  $("statut").textContent = "Démarrage...";
  $("barre").style.width = "0%";
  $("pct").textContent = "0";
  montrer("travail");
});
$("btn-texte").addEventListener("click", () => api().ouvrir_texte());
$("btn-dossier").addEventListener("click", () => api().ouvrir_dossier());
document.querySelectorAll("[data-retour]").forEach((b) =>
  b.addEventListener("click", () => montrer("accueil")));

window.addEventListener("pywebviewready", async () => {
  if (await api().modele_pret()) app.modelePret();
});
</script>
</body>
</html>
